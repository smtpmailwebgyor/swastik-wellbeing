      <stop offset="0%" stop-color="#041a1a"/>
      <stop offset="40%" stop-color="#083333"/>
      <stop offset="100%" stop-color="#0e4545"/>
    </linearGradient>
    <radialGradient id="g1" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#d4a853" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#041a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="15%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#3ea09a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#041a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#g1)"/>
  <rect width="1600" height="900" fill="url(#g2)"/>
