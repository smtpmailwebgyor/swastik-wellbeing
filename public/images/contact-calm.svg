  <path d="M0 600 Q200 580 400 600 Q600 620 800 600 Q1000 580 1200 600 Q1400 620 1600 600" fill="none" stroke="#3ea09a" stroke-opacity="0.12" stroke-width="1.5"/>
  <path d="M0 630 Q200 610 400 630 Q600 650 800 630 Q1000 610 1200 630 Q1400 650 1600 630" fill="none" stroke="#3ea09a" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M0 660 Q200 640 400 660 Q600 680 800 660 Q1000 640 1200 660 Q1400 680 1600 660" fill="none" stroke="#3ea09a" stroke-opacity="0.06" stroke-width="0.8"/>
