  <circle cx="1200" cy="220" r="100" fill="none" stroke="#d4a853" stroke-opacity="0.15" stroke-width="0.8"/>
  <circle cx="1200" cy="220" r="60"  fill="none" stroke="#d4a853" stroke-opacity="0.2"  stroke-width="0.6"/>
  <line x1="1100" y1="220" x2="1300" y2="220" stroke="#d4a853" stroke-opacity="0.15" stroke-width="0.6"/>
  <line x1="1200" y1="120" x2="1200" y2="320" stroke="#d4a853" stroke-opacity="0.15" stroke-width="0.6"/>
