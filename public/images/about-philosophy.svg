<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f7f6"/>
      <stop offset="100%" stop-color="#d5ebe9"/>
    </linearGradient>
    <radialGradient id="g1" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#c4963a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f0f7f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#g1)"/>
  <!-- Lotus petals -->
  <ellipse cx="400" cy="400" rx="80" ry="160" fill="#1e8a83" fill-opacity="0.12"/>
  <ellipse cx="400" cy="400" rx="80" ry="160" fill="#1e8a83" fill-opacity="0.12" transform="rotate(45 400 400)"/>
  <ellipse cx="400" cy="400" rx="80" ry="160" fill="#1e8a83" fill-opacity="0.12" transform="rotate(90 400 400)"/>
  <ellipse cx="400" cy="400" rx="80" ry="160" fill="#1e8a83" fill-opacity="0.12" transform="rotate(135 400 400)"/>
  <!-- Center circle -->
  <circle cx="400" cy="400" r="60" fill="#d4a853" fill-opacity="0.2"/>
  <circle cx="400" cy="400" r="30" fill="#d4a853" fill-opacity="0.3"/>
  <!-- Outer ring -->
  <circle cx="400" cy="400" r="280" fill="none" stroke="#125858" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="400" cy="400" r="340" fill="none" stroke="#d4a853" stroke-opacity="0.1" stroke-width="0.8"/>
</svg>
